<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dark:   #310b01;
    --mid:    #753110;
    --bright: #c86526;
    --light:  #f56d10;
    --grad:   linear-gradient(135deg, #753110 40%, #c86526 70%, #f56d10 100%);
    --font-display: 'Berlin Sans FB', 'Berlin Sans', 'Century Gothic', 'Futura', sans-serif;
    --font-body:    'DM Sans', sans-serif;
  }

  html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-body); }

  .bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #1a0400 0%, #310b01 50%, #753110 100%);
    z-index: 0;
  }
  .bg::before {
    content: '';
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,109,16,0.2) 0%, transparent 65%);
    top: -200px; right: -150px;
    animation: pulseOrb 6s ease-in-out infinite;
  }
  .bg::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,101,38,0.15) 0%, transparent 65%);
    bottom: -100px; left: -100px;
    animation: pulseOrb 8s ease-in-out infinite reverse;
  }
  @keyframes pulseOrb {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%       { transform: scale(1.1); opacity: 0.7; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  /* ── GCL Brand ── */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }
  .brand-logo {
    height: clamp(36px, 5vw, 52px);
    filter: brightness(0) invert(1);
  }
  .brand-divider {
    width: 1.5px;
    height: clamp(30px, 4vw, 44px);
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .brand-acronym {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.05em;
    color: #fff;
    line-height: 1;
  }
  .brand-fullname {
    font-family: var(--font-display);
    font-size: clamp(0.3rem, 0.8vw, 0.48rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
  }

  /* ── Pyro Energy wordmark ── */
  .wordmark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.4s;
  }
  .wordmark-logo {
    width: clamp(80px, 14vw, 140px);
    filter: brightness(0) invert(1) drop-shadow(0 0 20px rgba(245,109,16,0.6));
    animation: floatY 4.5s ease-in-out infinite;
  }
  .wordmark-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 7vw, 5rem);
    letter-spacing: 0.04em;
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
  }

  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }

  .headline {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 8vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 16px;
    background: var(--grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.6s;
  }

  .subtext {
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    max-width: 480px;
    line-height: 1.7;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.8s;
  }
  .subtext strong { color: rgba(255,255,255,0.9); font-weight: 600; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    border: 1.5px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.85);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 4px;
    transition: border-color 0.3s, background 0.3s, color 0.3s;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1s;
  }
  .back-btn:hover {
    border-color: var(--light);
    background: rgba(245,109,16,0.15);
    color: #fff;
  }

  /* ── Floating dots ── */
  .dots { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(245,109,16,0.1);
    animation: floatDot linear infinite;
  }
  @keyframes floatDot {
    0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .wordmark { flex-direction: column; gap: 6px; }
    .headline { font-size: clamp(2rem, 12vw, 3rem); }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="dots" id="dots"></div>

<div class="container">

  </div>

  <div class="wordmark">
    <img class="wordmark-logo" src="pictures/pyro_cooking.png" alt="Pyro Energy">
    <span class="wordmark-name">Energy</span>
  </div>

  <div class="headline">Coming Soon</div>

  <p class="subtext">
    Something <strong>powerful</strong> is being forged.<br>
    Our Pyro Energy page is currently under construction —<br>check back soon.
  </p>

  <a class="back-btn" href="index.html">← Back to Home</a>

</div>

<script>
  const container = document.getElementById('dots');
  for (let i = 0; i < 18; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    const size = 20 + Math.random() * 80;
    dot.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random() * 100}%;
      animation-duration:${10 + Math.random() * 16}s;
      animation-delay:-${Math.random() * 20}s;
    `;
    container.appendChild(dot);
  }
</script>
</body>
